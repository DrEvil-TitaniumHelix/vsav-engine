<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VALOR Engine — choose a game</title>
<style>
  html,body { margin:0; height:100%; background:#1a1c20; color:#dde3ea;
              font-family:Segoe UI,sans-serif; }
  body { display:flex; flex-direction:column; }
  header { padding:34px 40px 10px; }
  header h1 { margin:0; font-size:26px; color:#fff; font-weight:600; letter-spacing:.3px; }
  header .sub { color:#8a8f98; font-size:14px; margin-top:6px; }
  #wrap { flex:1; overflow:auto; padding:18px 40px 40px; }
  #cards { display:flex; flex-wrap:wrap; gap:20px; }
  .card { width:320px; background:#23262c; border:1px solid #3a3f47; border-radius:12px;
          padding:20px 22px; box-shadow:0 4px 18px rgba(0,0,0,.45);
          display:flex; flex-direction:column; gap:10px; }
  .card h2 { margin:0; font-size:19px; color:#fff; }
  .card .meta { display:flex; gap:8px; flex-wrap:wrap; }
  .tag { font-size:11px; padding:2px 9px; border-radius:20px; background:#2c2f36;
         border:1px solid #4a4f57; color:#b9c2cc; }
  .tag.ai   { background:#2f2740; border-color:#7a5aa5; color:#c9aef0; }
  .tag.soon { background:#2c2f36; border-color:#4a4f57; color:#98a0a8; }
  .tag.feature { background:#243d33; border-color:#3a7a5f; color:#8fd8b4; }
  .tag.cur  { background:#2a3a2a; border-color:#5a8a4a; color:#a8d89a; }
  .card .blurb { color:#9aa3ad; font-size:13px; line-height:1.5; flex:1; min-height:20px; }
  .card button { margin-top:6px; padding:10px 0; border:0; border-radius:7px; cursor:pointer;
                 background:#3a6ea5; color:#fff; font-size:15px; font-weight:600; }
  .card button:hover { background:#4880bd; }
  .card button:disabled { background:#3a3f47; color:#8a8f98; cursor:default; }
  .card.err { border-color:#7a3a3a; }
  .card.err .blurb { color:#e0a0a0; }
  .byo-state { font-size:14px; font-weight:600; color:#e3c791; }
  .byo-state.ready { color:#a8d89a; }
  .requirement { border-top:1px solid #3a3f47; padding-top:10px; font-size:13px; line-height:1.5; }
  .requirement code { overflow-wrap:anywhere; color:#dde3ea; }
  .requirement a { color:#9cc4ee; }
  .hint { color:#9aa3ad; margin:8px 0; }
  .module-input { width:100%; font-size:12px; }
  .browse { width:100%; }
  .byo-msg { color:#e0a0a0; font-size:13px; overflow-wrap:anywhere; }
  footer { padding:14px 40px 22px; color:#6c7178; font-size:12px; border-top:1px solid #2a2d33; }
  footer b { color:#9aa3ad; font-weight:600; }
  #loading { color:#8a8f98; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>VALOR Engine <span style="color:#8a8f98;font-weight:400">— VASSAL-Adjudicated Legality Of Rules</span></h1>
  <div class="sub">Choose a game to play. Rules are enforced by the engine; your move history replays exactly.</div>
</header>
<div id="wrap">
  <div id="loading">Loading games…</div>
  <div id="cards"></div>
</div>
<footer>
  <b>DrEvil / Titanium Helix</b> &nbsp;·&nbsp; <span id="ver">local build</span> &nbsp;·&nbsp; <a href="https://github.com/DrEvil-TitaniumHelix/vsav-engine/issues" target="_blank" rel="noopener" style="color:#9cc4ee">contact the developer / report a bug</a>
</footer>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nativePicker = () => window.pywebview && window.pywebview.api && window.pywebview.api.choose_module;
function pickers(){
  const native = !!nativePicker();
  document.querySelectorAll(".browse").forEach(e => e.hidden = !native);
  document.querySelectorAll(".module-input").forEach(e => e.hidden = native);
}
window.addEventListener("pywebviewready", pickers);
async function supply(g, card, req, file){
  const msg = card.querySelector(".byo-msg");
  const controls = req.querySelectorAll("button,input");
  controls.forEach(e => e.disabled = true);
  try {
    let opts;
    if (file){
      opts = {method:"POST", headers:{"Content-Type":"application/octet-stream"}, body:file};
    } else {
      const path = await window.pywebview.api.choose_module();
      if (!path) return;
      opts = {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({path})};
    }
    msg.textContent = "Checking module and reading its assets…";
    const d = await (await fetch("/api/byo/" + encodeURIComponent(g.slug), opts)).json();
    if (d.error || !d.ok) throw new Error(d.error || "Could not import the module.");
    await load();
  } catch(e){ msg.textContent = e.message || String(e); }
  finally { controls.forEach(e => e.disabled = false); req.querySelector("input").value = ""; }
}
async function play(slug, card){
  const btn = card.querySelector(".play");
  btn.disabled = true; btn.textContent = "Loading…";
  try {
    const r = await fetch("/api/load_game", {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({slug})});
    const d = await r.json();
    if (d.error){ btn.disabled=false; btn.textContent="Play"; alert(d.error); return; }
    location.href = "/" + (d.client || "index.html");
  } catch(e){ btn.disabled=false; btn.textContent="Play"; alert("Could not start: "+e); }
}
async function load(){
  let data;
  try { data = await (await fetch("/api/games")).json(); }
  catch(e){ document.getElementById("loading").textContent = "Could not reach the engine."; return; }
  document.getElementById("loading").style.display = "none";
  if (data.version) document.getElementById("ver").textContent = "v" + data.version;
  const cards = document.getElementById("cards");
  cards.replaceChildren();
  for (const g of data.games){
    const card = document.createElement("div");
    card.className = "card" + (g.error ? " err" : "");
    if (g.error){
      card.innerHTML = `<h2>${esc(g.name)}</h2><div class="blurb">Unavailable: ${esc(g.error)}</div>`;
      cards.appendChild(card); continue;
    }
    const tags = (g.tags || []).map(t =>
      `<span class="tag ${esc(t.kind)}"${t.title ? ` title="${esc(t.title)}"` : ''}>${esc(t.label)}</span>`).join('');
    card.innerHTML =
      `<h2>${esc(g.name)}</h2>
       <div class="meta">
         ${tags}
         ${g.current ? '<span class="tag cur">last played</span>' : ''}
       </div>
       <div class="blurb">${esc(g.blurb)}</div>
       <div class="byo-state${g.ready ? ' ready' : ''}">${g.ready ? "Ready" : "Needs your module"}</div>
       <div class="requirements"></div>
       <div class="byo-msg" role="status"></div>
       <button class="play"${g.ready ? '' : ' disabled'}>Play</button>`;
    if (!g.ready){
      if (g.byo.error) card.querySelector(".byo-msg").textContent = g.byo.error;
      for (const r of g.byo.requirements){
        const req = document.createElement("div");
        req.className = "requirement";
        req.innerHTML = `<div><code>${esc(r.filename)}</code> (${Number(r.size).toLocaleString()} bytes)</div>
          <a href="${esc(r.page)}" target="_blank" rel="noopener">VASSAL Module Library</a>
          <div class="hint">${esc(r.hint)}</div>`;
        if (r.have){
          const have = document.createElement("div");
          have.textContent = "Ready"; req.appendChild(have);
        } else {
          req.insertAdjacentHTML("beforeend", `<input class="module-input" type="file" aria-label="Choose ${esc(r.filename)}">
            <button class="browse" hidden>Choose module…</button>`);
          req.querySelector("input").onchange = e => { if (e.target.files[0]) supply(g, card, req, e.target.files[0]); };
          req.querySelector("button").onclick = () => supply(g, card, req);
        }
        card.querySelector(".requirements").appendChild(req);
      }
    }
    card.querySelector(".play").onclick = () => play(g.slug, card);
    cards.appendChild(card);
  }
  pickers();
}
load();
</script>
</body>
</html>
